basePath: /
definitions:
  main.ErrorResponse:
    properties:
      error:
        example: Item not found
        type: string
    type: object
  main.Item:
    properties:
      id:
        type: string
      name:
        type: string
      price:
        minimum: 0
        type: number
      stock:
        minimum: 0
        type: integer
    required:
    - name
    type: object
  main.ItemInput:
    properties:
      name:
        example: USB-C Dock
        type: string
      price:
        example: 79.99
        type: number
      stock:
        example: 12
        type: integer
    type: object
  main.ItemListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/main.Item'
        type: array
      metadata:
        $ref: '#/definitions/main.ListMetadata'
    type: object
  main.ItemResponse:
    properties:
      item:
        $ref: '#/definitions/main.Item'
    type: object
  main.ListMetadata:
    properties:
      limit:
        example: 10
        type: integer
      offset:
        example: 0
        type: integer
    type: object
  main.MessageResponse:
    properties:
      message:
        example: Item deleted successfully
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Inventory management API with pagination, sorting, filtering and rate
    limiting (1 request/second, burst of 5).
  title: Inventory API
  version: "1.0"
paths:
  /inventory:
    get:
      description: Returns a page of items. Supports pagination, sorting and filtering.
      parameters:
      - default: 10
        description: Items per page (1-100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Items to skip
        in: query
        name: offset
        type: integer
      - default: name
        description: Field to sort by
        enum:
        - name
        - stock
        - price
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Case-insensitive partial name match
        in: query
        name: name
        type: string
      - description: Minimum stock level
        in: query
        name: min_stock
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ItemListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: List items
      tags:
      - inventory
    post:
      consumes:
      - application/json
      description: The ID is generated by the server.
      parameters:
      - description: Item to create
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/main.ItemInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.ItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Create an item
      tags:
      - inventory
  /inventory/{id}:
    delete:
      parameters:
      - description: Item ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Delete an item
      tags:
      - inventory
    get:
      parameters:
      - description: Item ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ItemResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get an item
      tags:
      - inventory
    put:
      consumes:
      - application/json
      description: Replaces name, stock and price. The ID cannot be changed.
      parameters:
      - description: Item ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: New item values
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/main.ItemInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Update an item
      tags:
      - inventory
swagger: "2.0"
